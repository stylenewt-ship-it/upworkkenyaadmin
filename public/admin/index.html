<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin — Upwork Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1220;--surface:#111a2e;--surface2:#16233d;--text:#e6edf7;--muted:#8fa2bd;--border:#1f2c47;--primary:#14a800;--grad:linear-gradient(135deg,#14a800,#0ea5a0);--danger:#ef4444;--amber:#f59e0b;--radius:16px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  input,select{padding:11px 14px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface2);color:var(--text);width:100%;font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--primary)}
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}

  /* login gate */
  #gate{min-height:100vh;display:grid;place-items:center;background:radial-gradient(700px 400px at 50% -60px,rgba(20,168,0,.18),transparent)}
  #gateCard{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:36px;width:min(92vw,400px);text-align:center;animation:pop .5s cubic-bezier(.2,1.3,.3,1);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  #gateCard h1{font-size:22px;margin:12px 0 4px}
  .lock{font-size:44px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:12px 20px;font-size:14px;font-weight:700;transition:transform .15s,box-shadow .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(20,168,0,.35)}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .err-msg{color:#fca5a5;font-size:13px;margin-top:12px;display:none}

  /* shell */
  #shell{display:none;min-height:100vh}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .brand{font-weight:900;font-size:19px}
  .brand span{color:var(--primary)}
  .layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}
  .sidebar{border-right:1px solid var(--border);padding:20px 12px;background:var(--surface)}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:4px;border:none;background:none;width:100%;text-align:left;transition:all .15s}
  .nav-item:hover{background:var(--surface2);color:var(--text)}
  .nav-item.active{background:rgba(20,168,0,.14);color:#4ade80}
  .main{padding:26px;animation:fadeUp .3s both;overflow-x:auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  .grid{display:grid;gap:16px}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .stat .num{font-size:28px;font-weight:900}
  .stat .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .stat{border-left:4px solid var(--primary)}
  .stat.warn{border-left-color:var(--amber)}
  .stat.bad{border-left-color:var(--danger)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--border)}
  td{padding:10px;border-bottom:1px solid var(--border)}
  tr:hover td{background:var(--surface2)}
  .pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:700}
  .p-green{background:#12331f;color:#86efac}
  .p-amber{background:#3a2c10;color:#fcd34d}
  .p-red{background:#3f1d1d;color:#fca5a5}
  .p-blue{background:#16294d;color:#93c5fd}
  #toast{position:fixed;bottom:22px;right:22px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);padding:14px 18px;border-radius:12px;font-size:14px;font-weight:600;display:none;z-index:50;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .h1{font-size:24px;font-weight:900;margin-bottom:16px;letter-spacing:-.5px}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}.grid-4,.grid-3{grid-template-columns:1fr 1fr}.nav-item{white-space:nowrap}}
</style>
</head>
<body>

<!-- login gate -->
<div id="gate">
  <div id="gateCard">
    <div class="lock">🛡️</div>
    <h1>Upwork<span style="color:var(--primary)">Kenya</span> Admin</h1>
    <p style="color:var(--muted);font-size:13.5px;margin-bottom:16px">Restricted area — authorised staff only.</p>
    <form id="gateForm">
      <input type="password" id="gatePw" placeholder="Admin password" autocomplete="current-password">
      <button class="btn btn-primary" style="width:100%;margin-top:14px" type="submit">Unlock dashboard →</button>
      <div class="err-msg" id="gateErr">Incorrect password.</div>
    </form>
  </div>
</div>

<!-- shell -->
<div id="shell">
  <div class="topbar">
    <div class="brand">Upwork<span>Kenya</span> <span style="font-size:11px;background:var(--grad);padding:3px 10px;border-radius:99px;color:#fff;vertical-align:middle">ADMIN</span></div>
    <div style="flex:1"></div>
    <button class="btn btn-ghost btn-sm" onclick="loadAll()">↻ Refresh</button>
    <button class="btn btn-danger btn-sm" onclick="logout()">Lock</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <button class="nav-item active" data-v="overview">📊 Overview</button>
      <button class="nav-item" data-v="users">👥 Users</button>
      <button class="nav-item" data-v="withdrawals">💸 Withdrawals</button>
      <button class="nav-item" data-v="assignments">⚡ Task Submissions</button>
      <button class="nav-item" data-v="payments">💳 M-Pesa Payments</button>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
let KEY = sessionStorage.getItem('uk_admin_key') || '';
const $ = id => document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
function money(n){ return 'KES ' + Number(n||0).toLocaleString('en-KE'); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ago(ts){ const m=Math.floor((Date.now()-ts)/60000); if(m<1)return'now'; if(m<60)return m+'m'; const h=Math.floor(m/60); if(h<24)return h+'h'; return Math.floor(h/24)+'d'; }

async function api(p, opts={}){
  const r = await fetch(p, { ...opts, headers: { 'Content-Type':'application/json', 'x-admin-key': KEY }});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'Request failed');
  return d;
}

$('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    // Exchange the password for a short-lived server-side session token.
    // The password itself is never stored in the browser or used as an API key.
    const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: $('gatePw').value }) });
    const d = await r.json().catch(()=>({}));
    if (!r.ok || !d.key) throw new Error(d.error || 'Login failed');
    KEY = d.key;
    sessionStorage.setItem('uk_admin_key', KEY);
    $('gatePw').value = '';
    enter();
  } catch { $('gateErr').style.display='block'; KEY=''; sessionStorage.removeItem('uk_admin_key'); }
});

function enter(){ $('gate').style.display='none'; $('shell').style.display='block'; loadAll(); }
function logout(){ sessionStorage.removeItem('uk_admin_key'); location.reload(); }
if (KEY) { api('/api/admin/stats').then(enter).catch(()=>{ KEY=''; sessionStorage.removeItem('uk_admin_key'); }); }

document.querySelectorAll('.nav-item').forEach(b => b.onclick = () => {
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); loadView(b.dataset.v);
});
function loadAll(){ loadView(document.querySelector('.nav-item.active').dataset.v); }
function loadView(v){ ({overview:viewOverview,users:viewUsers,withdrawals:viewWd,assignments:viewAsg,payments:viewPays})[v](); }

async function viewOverview(){
  const s = await api('/api/admin/stats');
  $('main').innerHTML = `
    <div class="h1">Platform overview</div>
    <div class="grid grid-4">
      <div class="card stat"><div class="num">${s.users}</div><div class="lbl">Total users</div></div>
      <div class="card stat"><div class="num">${s.testsPassed}</div><div class="lbl">Passed typing test</div></div>
      <div class="card stat"><div class="num">${s.verified}</div><div class="lbl">Verified ✓</div></div>
      <div class="card stat"><div class="num">${s.gigs}</div><div class="lbl">Active gigs</div></div>
      <div class="card stat"><div class="num">${s.assignments}</div><div class="lbl">Task submissions</div></div>
      <div class="card stat"><div class="num">${s.orders}</div><div class="lbl">Orders</div></div>
      <div class="card stat warn"><div class="num">${s.pendingWithdrawals}</div><div class="lbl">Pending withdrawals</div></div>
      <div class="card stat bad"><div class="num">${money(s.feesCollected)}</div><div class="lbl">Platform fees collected</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-bottom:6px">Total paid to freelancers: <span style="color:var(--primary)">${money(s.totalPaidOut)}</span></h3>
      <p style="color:var(--muted);font-size:13px">Platform revenue comes only from the 10% service fee on completed work.</p>
    </div>`;
}

async function viewUsers(){
  const r = await api('/api/admin/users');
  $('main').innerHTML = `
    <div class="h1">Users (${r.users.length})</div>
    <div class="card" style="padding:6px 12px;overflow-x:auto">
      <table><thead><tr><th>Name</th><th>Email</th><th>Wallet</th><th>Tier</th><th>Test</th><th>Verified</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${r.users.map(u=>`
        <tr>
          <td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td>
          <td><b>${money(u.wallet)}</b></td>
          <td><span class="pill p-blue">${u.tier}</span></td>
          <td>${u.testPassed?'<span class="pill p-green">passed</span>':'<span class="pill p-amber">pending</span>'}</td>
          <td>${u.verified?'<span style="color:#1d9bf0;font-weight:800">✓</span>':'—'}</td>
          <td>${u.suspended?'<span class="pill p-red">suspended</span>':'<span class="pill p-green">active</span>'}</td>
          <td style="white-space:nowrap">
            <select onchange="setTier('${u.id}',this.value)" style="width:auto;padding:6px 8px;display:inline-block">
              <option value="">Tier…</option><option value="basic">Basic</option><option value="premium">Premium</option><option value="advanced">Advanced</option><option value="pro">Pro</option><option value="advancedPro">Advanced Pro</option>
            </select>
            <button class="btn btn-ghost btn-sm" onclick="adjust('${u.id}')">± KES</button>
            <button class="btn ${u.suspended?'btn-primary':'btn-danger'} btn-sm" onclick="suspend('${u.id}',${!u.suspended})">${u.suspended?'Unsuspend':'Suspend'}</button>
          </td>
        </tr>`).join('')}</tbody></table>
    </div>`;
}
async function setTier(id, tier){ if(!tier) return; try{ await api(`/api/admin/users/${id}/tier`,{method:'POST',body:JSON.stringify({tier})}); toast('Tier updated'); }catch(e){ toast(e.message);} }
async function suspend(id, s){ try{ await api(`/api/admin/users/${id}/suspend`,{method:'POST',body:JSON.stringify({suspended:s})}); toast(s?'User suspended':'User reinstated'); viewUsers(); }catch(e){ toast(e.message);} }
async function adjust(id){
  const amt = prompt('Amount in KES (negative to deduct):'); if(!amt) return;
  const note = prompt('Reason / note:') || 'Admin adjustment';
  try{ await api(`/api/admin/users/${id}/adjust`,{method:'POST',body:JSON.stringify({amount:Number(amt),note})}); toast('Wallet adjusted'); viewUsers(); }catch(e){ toast(e.message);}
}

async function viewWd(){
  const r = await api('/api/admin/withdrawals');
  const pillCls = s => (s==='cleared'||s==='paid')?'p-green':s==='approved'?'p-blue':s==='rejected'?'p-red':'p-amber';
  const lbl = s => s==='paid'?'cleared':s;
  $('main').innerHTML = `
    <div class="h1">Withdrawal requests</div>
    <p style="color:var(--muted);font-size:13px;margin:-8px 0 14px">Flow: <b>pending</b> → <b>Approve</b> it → send the money from your phone (M-Pesa) → <b>Mark cleared</b>. Rejecting refunds the user's wallet.</p>
    <div class="card" style="padding:6px 12px;overflow-x:auto">
      ${r.withdrawals.length ? `<table><thead><tr><th>User</th><th>Amount</th><th>M-Pesa</th><th>Status</th><th>Requested</th><th>Actions</th></tr></thead>
      <tbody>${r.withdrawals.map(w=>`
        <tr><td>${esc(w.userId)}</td><td><b>${money(w.amount)}</b></td><td>${esc(w.phone)}</td>
        <td><span class="pill ${pillCls(w.status)}">${lbl(w.status)}</span></td>
        <td>${ago(w.at)}</td>
        <td style="white-space:nowrap">${w.status==='pending'
          ? `<button class="btn btn-primary btn-sm" onclick="wd('${w.id}','approved')">Approve</button> <button class="btn btn-danger btn-sm" onclick="wd('${w.id}','rejected')">Reject</button>`
          : w.status==='approved'
            ? `<button class="btn btn-primary btn-sm" onclick="wd('${w.id}','cleared')">✓ Mark cleared (money sent)</button> <button class="btn btn-danger btn-sm" onclick="wd('${w.id}','rejected')">Reject</button>`
            : '—'}</td></tr>`).join('')}</tbody></table>`
      : '<p style="color:var(--muted);padding:14px">No withdrawal requests yet.</p>'}
    </div>`;
}
async function wd(id, status){ try{ await api(`/api/admin/withdrawals/${id}`,{method:'POST',body:JSON.stringify({status})}); toast('Updated'); viewWd(); }catch(e){ toast(e.message);} }

async function viewAsg(){
  const r = await api('/api/admin/assignments');
  $('main').innerHTML = `
    <div class="h1">Recent task submissions</div>
    <div class="card" style="padding:6px 12px;overflow-x:auto">
      ${r.assignments.length ? `<table><thead><tr><th>User</th><th>Task</th><th>Category</th><th>Gross</th><th>Fee</th><th>Net paid</th><th>Submission</th><th>When</th></tr></thead>
      <tbody>${r.assignments.map(a=>`
        <tr><td>${esc(a.userId)}</td><td>${esc(a.title)}</td><td><span class="pill p-blue">${esc(a.category)}</span></td>
        <td>${money(a.gross)}</td><td>${money(a.fee)}</td><td><b>${money(a.net)}</b></td>
        <td style="max-width:220px;font-size:12px;color:var(--muted)">${esc(a.submission).slice(0,120)}</td><td>${ago(a.at)}</td></tr>`).join('')}</tbody></table>`
      : '<p style="color:var(--muted);padding:14px">No submissions yet.</p>'}
    </div>`;
}
async function viewPays(){
  const r = await api('/api/admin/payments');
  const cls = s => s==='success'?'p-green':s==='failed'?'p-red':s==='cancelled'?'p-red':'p-amber';
  $('main').innerHTML = `
    <div class="h1">M-Pesa / STK transactions</div>
    <p style="color:var(--muted);font-size:13px;margin:-8px 0 14px">Every STK push: <b>pending</b> (PIN prompt sent) → <b>success</b> (confirmed, receipt shown) · <b>failed</b> / <b>cancelled</b> / <b>timeout</b>. Timeout means the callback never arrived — the user can still complete with the SMS code.</p>
    <div class="card" style="padding:6px 12px;overflow-x:auto">
      ${r.payments.length ? `<table><thead><tr><th>User</th><th>Purpose</th><th>Amount</th><th>Phone</th><th>Status</th><th>M-Pesa receipt</th><th>Ref</th><th>When</th></tr></thead>
      <tbody>${r.payments.map(p=>`
        <tr><td><b>${esc(p.user)}</b><div style="font-size:11px;color:var(--muted)">${esc(p.email)}</div></td>
        <td><span class="pill p-blue">${esc(p.purpose)}${p.packageKey?' · '+esc(p.packageKey):''}</span></td>
        <td><b>${money(p.amount)}</b></td><td>${esc(p.phone)}</td>
        <td><span class="pill ${cls(p.status)}">${esc(p.status)}</span>${p.manualReview?' <span class="pill p-amber" title="Completed with a user-entered SMS code while the gateway status was unavailable — verify against your M-Pesa statement">check</span>':''}</td>
        <td style="font-weight:700">${esc(p.receipt||'—')}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(p.reference)}</td><td>${ago(p.at)}</td></tr>`).join('')}</tbody></table>`
      : '<p style="color:var(--muted);padding:14px">No M-Pesa transactions yet.</p>'}
    </div>`;
}

/* Anti-inspection deterrent: blocks right-click and common DevTools shortcuts. */
(function antiInspect(){
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf(k) !== -1) || (e.ctrlKey && ['u','s'].indexOf(k) !== -1)) {
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
})();

/* Keep the free-tier backend (and the Neon database connection) awake while the admin panel is open. */
setInterval(function(){ fetch('/api/health').catch(function(){}); }, 10 * 60 * 1000);
fetch('/api/health').catch(function(){});
</script>
</body>
</html>
